<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Conveyor Track Lines -->
  <path d="M 22 68 H 78" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
  <circle cx="30" cy="68" r="5" fill="#4FACFE" />
  <circle cx="50" cy="68" r="5" fill="#a855f7" />
  <circle cx="70" cy="68" r="5" fill="#00F2FE" />

  <!-- Conveyed Media Elements (Glass Cards floating) -->
  <!-- Video/Media Symbol 1 -->
  <g transform="translate(22, 30)">
    <rect width="24" height="24" rx="6" fill="rgba(255,255,255,0.1)" stroke="url(#cyan-grad)" stroke-width="2" filter="url(#glow)"/>
    <polygon points="10,8 17,12 10,16" fill="#00F2FE" />
  </g>

  <!-- Audio/Wave Symbol 2 -->
  <g transform="translate(54, 24)">
    <rect width="24" height="24" rx="6" fill="rgba(255,255,255,0.1)" stroke="url(#purple-grad)" stroke-width="2" filter="url(#glow)"/>
    <line x1="8" y1="12" x2="8" y2="12" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="7" x2="12" y2="17" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="16" y1="10" x2="16" y2="14" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
